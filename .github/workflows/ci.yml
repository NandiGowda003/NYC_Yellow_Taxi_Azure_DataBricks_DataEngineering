name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m compileall -q api scripts tests databricks

      - name: Validate repository structure
        run: |
          check_dir() {
            if [ -d "$1" ]; then
              echo "PASS: directory exists -> $1"
            else
              echo "FAIL: directory missing -> $1"
              exit 1
            fi
          }

          check_file() {
            if [ -f "$1" ]; then
              echo "PASS: file exists -> $1"
            else
              echo "FAIL: file missing -> $1"
              exit 1
            fi
          }

          check_dir ".github/workflows"
          check_dir "databricks"
          check_dir "sql"
          check_dir "sql/control"

          check_file "README.md"
          check_file ".gitignore"
          check_file ".github/workflows/ci.yml"

      - name: Check for accidentally committed data files
        run: |
          if find . -type f \( \
            -name "*.parquet" -o \
            -name "*.csv" -o \
            -name "*.zip" \
          \) -not -path "./.git/*" | grep -q .; then
            echo "ERROR: Data files detected in repository."
            exit 1
          fi

          echo "PASS: No accidental data files detected."

      - name: Check for possible secrets
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude="ci.yml" \
            "(AccountKey=|DefaultEndpointsProtocol=|SharedAccessSignature=|client_secret|password=)" \
            .; then
            echo "ERROR: Possible credentials or secrets detected."
            exit 1
          fi

          echo "PASS: No obvious secrets detected."

      - name: CI completed
        run: |
          echo "Repository validation completed successfully."
