name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m compileall -q api scripts tests databricks

      - name: Validate repository structure
        run: |
          test -d .github/workflows
          test -d databricks
          test -d sql
          test -d sql/control
          test -f README.md
          test -f .gitignore
          test -f .github/workflows/ci.yml

      - name: Check for accidentally committed data files
        run: |
          if find . -type f \( \
            -name "*.parquet" -o \
            -name "*.csv" -o \
            -name "*.zip" \
          \) -not -path "./.git/*" | grep -q .; then
            echo "ERROR: Data files detected in repository."
            exit 1
          fi

      - name: Check for possible secrets
        run: |
          if grep -RniE \
            --exclude-dir=.git \
            --exclude="ci.yml" \
            "(AccountKey=|DefaultEndpointsProtocol=|SharedAccessSignature=|client_secret|password=)" \
            .; then
            echo "ERROR: Possible credentials or secrets detected."
            exit 1
          fi

      - name: CI completed
        run: echo "Repository validation completed successfully."
